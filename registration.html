<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Page</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      font-family: 'Segoe UI', sans-serif;
    }

    .login-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 40px 35px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
    }

    .login-card h2 {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .login-card p.subtitle {
      color: #6c757d;
      margin-bottom: 25px;
    }

    .form-label {
      font-weight: 500;
    }

    .btn-login {
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      border: none;
      color: white;
      font-weight: 600;
      padding: 10px;
      border-radius: 8px;
    }

    .btn-login:hover {
      opacity: 0.9;
      color: white;
    }

    .form-control:focus {
      border-color: #6a11cb;
      box-shadow: 0 0 0 0.2rem rgba(106, 17, 203, 0.15);
    }

    .extra-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 15px 0;
      font-size: 0.9rem;
    }

    .extra-links a {
      color: #2575fc;
      text-decoration: none;
    }

    .extra-links a:hover {
      text-decoration: underline;
    }

    .signup-text {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
    }

    .signup-text a {
      color: #6a11cb;
      font-weight: 600;
      text-decoration: none;
    }

    .invalid-feedback {
      display: none;
    }

    .was-validated .form-control:invalid ~ .invalid-feedback {
      display: block;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>Create Account</h2>
    <p class="subtitle">Please fill in the details to create your account</p>

    <form id="registrationForm" class="needs-validation" novalidate>
        <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" class="form-control" id="name" placeholder="Enter your full name" required>
        <div class="invalid-feedback">Please enter your full name.</div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
        <div class="invalid-feedback">Please enter a valid email address.</div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="Enter your password" required minlength="6">
        <div class="invalid-feedback">Password must be at least 6 characters.</div>
      </div>

      <div class="extra-links">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remember">
          <label class="form-check-label" for="remember">
            Remember me
          </label>
        </div>
        <a href="#">Forgot password?</a>
      </div>

      <button type="submit" class="btn btn-login w-100">Create Account</button>

      <p class="signup-text">
       <span> Don't have an account?</span> <a href="login.html">Log in</a>
      </p>
    </form>
  </div>


 <script>
    const registrationForm = document.getElementById('registrationForm');
    registrationForm.addEventListener('submit',function(event){
        event.preventDefault();
           if(!registrationForm.checkValidity()){
            registrationForm.classList.add('was-validated');
            } else {
                const name = document.getElementById('name').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const remember = document.getElementById('remember').checked;
                
                const userData = {
                    name: name,
                    email: email,
                    password: password,
                    remember: remember
                };
                localStorage.setItem('userData', JSON.stringify(userData));
                

            }
            
    });
 </script>

</body>
</html>
